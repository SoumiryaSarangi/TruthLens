# FR-11, Phase 6 decision D4: the learned aggregator, stance = bilstm.
#
# siamese BiLSTM stance, train claims scored CROSS-FITTED (5 claim-level folds).
# Retrieval as Phase 5's best: hybrid RRF@200, k 10. Aggregator: multinomial LR
# over features of the whole top-10 stance distribution, trained on AVeriTeC
# TRAIN (cross-fitted where the stance model is trained), temperature fitted on
# dev (FR-13). Relevance floor off; tau_abstain 0.
#
# Baseline: the LEARNED claim-only control (f0004198efff), same retrieval,
# same aggregator, same folds -- so the delta is exactly what reading the
# evidence adds (decision D4). Paired bootstrap: same 500 claims, 95% CI on
# that delta; a delta inside its interval is not a finding. The Phase 5 bar
# (0.2514) is the control's own baseline. NotAClaim has zero support, so
# macro-F1 is capped at 0.80.
experiment: p6_verdict_learned_bilstm
task: classification
split: data/splits/averitec/dev.jsonl
predictions: results/preds/p6_verdict_learned_bilstm.jsonl
label_set: verdict_5class
baseline: f0004198efff
paired_bootstrap: 2000
breakdown: [lang, script]
sanity_ceiling: 0.85
calibration:
  coverage_target: 0.6
notes: >
  retrieval=hybrid (rrf, depth 200, k 10), stance=bilstm, aggregate=learned
  (data/interim/models/aggregator_bilstm, fitted temperature), relevance floor off,
  tau_abstain 0. Three questions: current best 0.2514 (claim-only, rule); dumb
  baseline majority_class 0.1516; invalid if train claims were scored by a stance
  model that saw them (train_aggregator.py refuses that), or if the temperature
  were fitted on test.
