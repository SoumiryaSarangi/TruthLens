# FR-3 baseline: the Phase 1 script-derived guess, on the hand-typed forwards.
#
# Every row here is Latin script, so this baseline answers "en" for all 100 --
# which is exactly the Phase 1 behaviour Phase 2 exists to replace. It is the
# floor the real language ID has to beat, and its config_hash is what
# p2_lid_handtyped.yaml names as its baseline.
experiment: p2_lid_handtyped_script
task: classification
split: data/splits/handtyped/dev.jsonl
predictions: results/preds/p2_lid_handtyped_script.jsonl
gold_field: lang
label_set: lang_4class
baseline: majority_class
breakdown: [lang, script]
# The default 0.85 is calibrated for VERDICT accuracy on AVeriTeC, where higher
# means leakage. Language ID is an easier task. The 0.87 the hybrid scores here
# was checked the way the warning asks: 0 of the 100 rows appear verbatim or as
# a substring anywhere in the classifier's training pool, which reads train
# splits only and never opens this file.
sanity_ceiling: 0.995
notes: >
  Hand-typed romanized forwards (FR-26), n=100, all Latin script.
  Baseline implementation: preprocess=passthrough.
  macro-F1 is over 4 classes while gold contains only hi and pa, so it is
  structurally capped at 0.50 here. Read it against that ceiling, not against 1.0.
