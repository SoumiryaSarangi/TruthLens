# FR-7 span baseline: predict that the entire post is the claim.
#
# The X-CLAIM paper's own baseline, and not a straw man. On this dev split 25.8%
# of gold spans ARE the whole post and 52.1% of tokens are claim tokens, so this
# scores recall 1.0 and precision ~0.52 by construction. Read exact_span_match
# and token_precision beside token_f1: a model that ties this on F1 has learned
# nothing. PRD 8 requires beating it PER LANGUAGE, not on the average.
experiment: p3_span_whole_post
task: span
split: data/splits/x_claim/dev.jsonl
gold: data/gold/x_claim_dev_span.jsonl
predictions: results/preds/p3_span_whole_post.jsonl
baseline: whole_post_span
breakdown: [lang, script]
notes: >
  Baseline scored against itself so the row exists in the table with its own
  config_hash; the model runs then chain to that hash. Token F1 over claim
  tokens only -- `O` is not scored as a class, because about half of every
  X-CLAIM post is not the claim and an all-`O` prediction would otherwise look
  respectable.
