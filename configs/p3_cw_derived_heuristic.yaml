# FR-6 check-worthiness on the DERIVED set. Model selection only.
#
# 963 dev rows, 600 Yes / 363 No, built by `load_xclaim_checkworthy` from
# X-CLAIM's span annotations: the span is a positive, the out-of-span remainder
# is a negative. The negatives are therefore CONSTRUCTED -- fragments of posts
# that did contain a claim -- so they share vocabulary and register with their
# own positives, which makes this set easier than reality.
#
# Nothing here is the reported figure. The hand-typed 100 are.
experiment: p3_cw_derived_heuristic
task: classification
split: data/splits/xclaim_cw/dev.jsonl
predictions: results/preds/p3_cw_derived_heuristic.jsonl
label_set: checkworthy_binary
baseline: majority_class
breakdown: [lang, script]
notes: >
  Implementation: claims=heuristic (rules only, no weights). Baseline is
  majority_class, which predicts Yes for everything -- so a heuristic that
  catches no negatives ties it exactly, and that tie is the result.
