# Ablation: does transliterating a romanized query into native script help
# claim matching, or does the embedding model already handle romanized input?
#
# Same encoder, same index, same 3,153 queries as p2_match_labse. The only
# difference is that the 52 rows the language layer transliterates are queried
# with their Devanagari/Gurmukhi form instead of what the user typed. So the
# overall figure barely moves by construction -- the cell to read is
# lang=hi,script=latn (n=57), which is where every changed row lives.
experiment: p2_match_labse_translit
task: retrieval
split: data/splits/multiclaim/dev.jsonl
gold: data/gold/multiclaim_dev_retrieval.jsonl
corpus_ids: data/interim/index/ids.json
predictions: results/preds/p2_match_labse_translit.jsonl
baseline: random_rank
breakdown: [lang, script]
metrics:
  retrieval:
    k: [1, 5, 10]
notes: >
  LaBSE, fact-check pool 78,077, queries use `transliterated` where the language
  layer produced one (52 of 3,153 rows). Compare the hi/latn cell against
  p2_match_labse; the overall figure is not the comparison.
