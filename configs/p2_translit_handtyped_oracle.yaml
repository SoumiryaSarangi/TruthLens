# FR-5 transliteration on the hand-typed forwards.
#
# 33 Punjabi messages whose writer typed the SAME message twice -- once in Latin
# letters, once in Gurmukhi. That makes this the only reference in the project
# for transliterating REAL informal typing, as opposed to the tidy elicited
# romanizations in Dakshina.
#
# n=33 is small. Report the denominator every time; do not quote a bare percent.
experiment: p2_translit_handtyped_oracle
task: transliteration
split: data/splits/handtyped/dev.jsonl
gold: data/gold/handtyped_dev_translit.jsonl
predictions: results/preds/p2_translit_handtyped_oracle.jsonl
baseline: identity_transliteration
breakdown: [lang, script]
notes: >
  Implementation: preprocess=full, transliterator=rulebased
  (indic-transliteration 2.3.82 with informal-spelling pre-normalisation).
  Baseline leaves the romanized text untouched, so its CER is the size of the
  gap between how people type and how Punjabi is written.
  ORACLE LANGUAGE (force_lang=pa): language ID is bypassed so this measures the
  transliterator alone. Compare with p2_translit_handtyped, where the real
  language ID runs and never routes a single row to the transliterator -- the
  difference between the two is the cost FR-3 imposes on FR-5.
