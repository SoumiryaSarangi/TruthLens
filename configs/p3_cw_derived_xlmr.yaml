# FR-6 check-worthiness on the DERIVED set. Model selection only.
#
# 963 dev rows, 600 Yes / 363 No, built by `load_xclaim_checkworthy` from
# X-CLAIM's span annotations: the span is a positive, the out-of-span remainder
# is a negative. This is the set the classifier TRAINS on (its train split), so
# a good score here says it learned the task as posed -- not that the task as
# posed is the real one.
#
# Read this row next to p3_cw_handtyped_xlmr. The two disagree about which arm
# is better, and that disagreement is the finding.
experiment: p3_cw_derived_xlmr
task: classification
split: data/splits/xclaim_cw/dev.jsonl
predictions: results/preds/p3_cw_derived_xlmr.jsonl
label_set: checkworthy_binary
baseline: majority_class
breakdown: [lang, script]
notes: >
  Implementation: claims=xlmr -- the dedicated sequence classifier from
  scripts/train_checkworthy.py (XLM-R-base + LoRA), NOT the span model. Trained
  on this dataset's own train split. Baseline is majority_class, which predicts
  Yes for everything.
