#
#   TRUTHLENS_ALLOW_TEST=1 python -m pipeline.batch --split data/splits/averitec/test.jsonl \
#       --stage verdict --impl hybrid --depth 200 --fusion rrf --k 10 \
#       --stance-impl xlmr_nli --aggregate-impl learned \
#       --aggregator data/interim/models/aggregator_xlmr_nli_prior/model.joblib \
