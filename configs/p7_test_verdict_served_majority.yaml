experiment: p7_test_verdict_served_majority
task: classification
split: data/splits/averitec/test.jsonl
predictions: results/preds/p7_test_verdict_served.jsonl
label_set: verdict_5class
baseline: majority_class
breakdown: [lang, script]
sanity_ceiling: 0.85
calibration:
  coverage_target: 0.6
  tau: 0.3835
notes: >
  FINAL TEST RUN (docs/test-protocol.md), scored once with TRUTHLENS_ALLOW_TEST=1. tau 0.3835 is dev's (164d2289c90b); applied, not re-chosen.
