# FR-8, the fast-path gate with NO reranker. The control for the reranker arms.
#
# Why this exists when p4_fastpath_bge_m3 already measures an ungated
# bi-encoder: that run scores Phase 2's predictions file, which was produced by
# a different pipeline -- through the retrieval stage directly, and with whatever
# preprocess impl that run used. Comparing it against a reranked run would make
# the comparison two changes wide (reranker AND language layer AND code path),
# and a two-change comparison attributes everything to whichever change is being
# written up.
#
# So this arm runs the identical command as the reranker arms with `--reranker
# none`: same matcher, same `hybrid` preprocess, same top-10 candidates. The
# ablation across p4_fastpath_rerank_{none,nli,xlmr} differs in exactly one
# thing.
#
# p4_fastpath_bge_m3 is kept as what it is: the first Phase 4 number, measured on
# work already done, at zero inference cost.
experiment: p4_fastpath_rerank_none
task: fast_path
split: data/splits/multiclaim/dev.jsonl
gold: data/gold/multiclaim_dev_retrieval.jsonl
predictions: results/preds/p4_fastpath_rerank_none.jsonl
baseline: always_match
breakdown: [lang, script]
metrics:
  fast_path:
    # Cosine scale, so the grid is the one the Phase 2 profile was taken on.
    tau: 0.70
    taus: [0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
notes: >
  Retrieve top-10 with BGE-M3 over the 78,077-fact-check pool through the
  matching stage, preprocess `hybrid`, no reranking -- the gate reads the raw
  cosine. The control for p4_fastpath_rerank_nli and p4_fastpath_rerank_xlmr,
  which differ from it only in the reranker. Withheld-answer negatives are
  derived by dropping each query's gold from its returned list; exact for a
  cosine scorer, and false_accept_rate is an upper bound because MultiClaim's
  annotation is incomplete.
