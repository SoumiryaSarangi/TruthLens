# Which implementation runs at each stage.
# Changing a line here changes what runs -- never edit code to switch impls.
#
# Until Phase 4 this file still ran Phase 1 baselines at EVERY stage, so
# everything Phases 2 and 3 built was measured by the harness and not served:
# `claims: passthrough` returns check_worthy = True for any non-empty string, so
# `NotAClaim` -- the first card in the demo script and the answer to PRD scenario
# S4 -- was unreachable in the API.
name: p6_dev
split: dev
k: 10

# tau_match: chosen on dev (SRS FR-14, SYSTEM_DESIGN 6), reported by
# GET /version (FR-21), and set HIGH on purpose. The measured operating curve for
# the best of four gates (raw BGE-M3 cosine, task: fast_path on MultiClaim dev):
#
#     tau   coverage   precision   false accepts
#     0.70    40.5%      62.7%        21.5%
#     0.80    12.4%      67.3%         4.8%
#     0.85     4.9%      74.0%         1.4%
#     0.90     1.7%      81.8%         0.3%
#
# Precision here is "of the posts resolved on the fast path, how many cite the
# RIGHT fact-check". At 0.90 the fast path fires on 1.7% of posts (n=55) and is
# still wrong about one time in five. A wrong fast-path answer is this system's
# worst failure -- confident, sourced and presented as settled -- so the
# threshold is set where the error rate is lowest, accepting that the fast path
# then handles almost no traffic. **FR-8 is measured, not demo-ready**; see the
# Phase 4 entry in docs/project-log.md.
tau_match: 0.90

# tau_abstain (FR-14): chosen on DEV by the criterion fixed in the Phase 6 plan
# before any number was seen -- the lowest tau whose coverage is <= 60% -- on the
# served arm (stance xlmr_nli, aggregator_xlmr_nli_prior, temperature-scaled;
# run 164d2289c90b). At 0.3835 the system answers 60% of dev claims and accuracy
# on those rises 0.490 -> 0.587 (selective macro-F1 0.280 -> 0.311).
#
# (It was 0.317 for one day, on the NLI arm, where abstaining bought almost
# nothing: 0.320 -> 0.353.)
#
# Fast-path confidence is a raw retrieval cosine, not a calibrated probability;
# tau_abstain applies to the evidence path only.
tau_abstain: 0.3835

# AFTER THE TEST RUN (Phase 7; docs/report.md §8a). Free text only -- AVeriTeC
# and MultiClaim numbers cannot move. "Taj Mahal Shah Jahan ne banwaya tha" was
# refuted at 0.72: the transliterator garbled the names (तज महल शह जहन), the
# claim was searched in Latin letters anyway, and none of the ten passages said
# who built it. Search romanized hi/pa with the claim's native-script form too.
free_text_translit_query: true
# TRIED AND REJECTED, same day: abstain when no passage contains half the
# claim's content words (pipeline/relevance.py; 1/2 fixed before running it).
# On the demo forwards it stopped one wrong refutation but abstained on a
# well-supported one -- the lemon-water claim's best evidence is a SPANISH
# fact-check and a Hindi page with an inflected verb, and word overlap sees
# neither (coverage 0.00 and 0.40). Word overlap cannot judge the cross-lingual
# evidence this corpus is full of. Off.
free_text_coverage: null
# Post-test Phase 7: live Wikipedia + Google Fact Check, ONLY when a request
# asks (the UI's per-claim button), free text only. Off in every evaluation
# config; the frozen test numbers describe the system without it.
#
# OFF in the served config. The probe set (docs/live-search-probe.md) ran under a
# rule fixed in advance -- "adopt only if no correct answer turns wrong" -- and
# live search fixed 15 true claims but turned two correct refutations of FALSE
# claims into "Supported" (lemon water cures cancer; the Sun orbits the Earth). A
# tool against misinformation must not say Supported to a falsehood. The code,
# tests and button stay; flip this to true only after the fix in that document.
live_search: false

# relevance_floor (FR-12): OFF, chosen on dev in Phase 6 by verdict macro-F1.
# 0.45 and 0.50 abstain on zero dev claims; 0.55 and 0.60 abstain on 3 and 9 and
# only lower macro-F1 (0.60: -0.0065, CI excludes 0). AVeriTeC pools are
# retrieved FOR each claim, so a floor cannot be tuned there; on the demo
# corpus, where it would matter, there is no gold. The earlier note follows.
#
# Phase 5: built, tested, and OFF. Choosing it then would have tuned a
# threshold against the rule aggregator Phase 5 showed is broken; Phase 6 picks
# it on dev, after the learned aggregator.
relevance_floor: null

stages:
  # `hybrid`, not `full`: it beats `full` on romanized input by a wide margin on
  # the hand-typed set (macro-F1 0.4492 vs 0.0000) and loses to it on MultiClaim's
  # mostly-native text (0.6785 vs 0.7259). Romanized input is the primary use
  # case, not an edge case (CLAUDE.md), so the served config takes the romanized
  # win. It does not change retrieval: passthrough and hybrid produce identical
  # query text for 306/306 MultiClaim rows.
  preprocess: hybrid
  # `heuristic`, NOT the arm that wins the metric. Measured on the hand-typed 100:
  #
  #     impl        macro-F1   real claims rejected   no-claims caught
  #     nli           0.5938     18/85 = 21.2%             7/15
  #     xlmr          0.4536      2/85 =  2.4%             0/15
  #     heuristic     0.4595      0/85 =  0.0%             0/15
  #
  # macro-F1 picks `nli` and the product does not, because the two errors are not
  # symmetric and macro-F1 treats them as if they were. A false `NotAClaim` fails
  # the user completely -- they forwarded a rumour and the system answered "there
  # is no checkable factual claim here", with no verification and no recourse. A
  # false check-worthy costs an NEI answer on a blessing: mildly silly, harmless.
  # One in five real claims is too high a price for catching seven blessings.
  #
  # This does not retract the FR-6 result: `nli` is still the best arm on the
  # metric and stays the reported number. The served config makes the cost-aware
  # choice, and both are recorded. Revisit when there are enough real no-claim
  # messages to pick an operating point that does not cost claim recall.
  #
  # Surfaced only by running the pipeline end to end: with `nli` the served
  # config answered `NotAClaim` to "Sarkar ne announce kiya hai ki har student ko
  # 6000 rupaye milenge" while accepting a Punjabi blessing. The metric never
  # showed that; two example forwards did.
  #
  # Phase 7: `heuristic_span` -- the heuristic above still decides IF there is a
  # claim, and the joint XLM-R span model now decides WHICH sentences are claims.
  # The heuristic alone made every 4+ word sentence a claim: span F1 0.7095 on
  # X-CLAIM dev (p7_span_heuristic), barely above whole-post 0.6851, against the
  # span model's 0.7463 -- and on real forwards it verified "Dosto dhyan se
  # padho!!" and refuted it at 0.83. Rule fixed before measuring: serve it unless
  # significantly worse on AVeriTeC dev. Delta -0.0030, CI [-0.0115, +0.0041]
  # (268b03cffbd4 vs 164d2289c90b): served. One-sentence input never reaches the
  # model.
  claims: heuristic_span
  matching: factcheck
  # Phase 5. `hybrid`: BM25 top 200 -> BGE-M3 passage rerank -> RRF, the best
  # Success@10 of the ablation (0.214 vs BM25's 0.158 on AVeriTeC dev).
  retrieval: hybrid
  # Free text -- every real forward -- has no AVeriTeC pool. `corpus` searches
  # the demo corpus instead: hi/pa Wikipedia lead sections plus the 78,077
  # fact-checks (SYSTEM_DESIGN.md §14, D7). It has no gold and no metric; it is
  # verified by smoke test and the demo. Without this line free text answers NEI.
  free_text_retrieval: corpus
  # PROVISIONAL, and NOT the arm the Phase 5 log first named. The verdict table
  # picks no stance model yet: under the rule aggregator the claim-only control
  # wins (0.2514), because a model that ignores evidence can never trigger
  # Conflicting. The choice is Phase 6's, against the learned aggregator.
  #
  # `xlmr` was served first, as "the only arm shown to read evidence" (+0.0484
  # over its claim-only twin on derived dev). Seven real forwards through this
  # file showed that does not hold on the demo corpus: xlmr labelled every
  # passage of five of them exactly as its claim-only twin did, and answered
  # Refuted or Conflicting to all seven -- "दिल्ली भारत की राजधानी है" (Delhi is
  # India's capital) came back Refuted. `nli` reads the passages (10/10 Supports
  # on the Delhi leads) and its remaining errors are the aggregator's: one
  # Refutes among nine Supports makes Conflicting. Seven forwards are not a
  # metric; they are enough not to serve a model that ignores the evidence its
  # explanation cites. Project log, 2026-10-01, "the demo corpus".
  #
  # Phase 6, D4, against the learned aggregator: NO evidence-reading stance model
  # beats the claim-only control (0.2949) on AVeriTeC dev. xlmr 0.2802 (tie,
  # CI -0.062..+0.030), bilstm 0.2340 and nli 0.2135 (both significantly worse).
  #
  # DECIDED 2026-10-02 (the project owner delegated it): `xlmr_nli`. Each model
  # does the job it is measurably good at:
  #   * the VERDICT reads XLM-R -- +0.067 macro-F1 over NLI, CI [+0.022, +0.112]
  #     (24d42acb4fea), accuracy 0.49 vs 0.32, and abstention that works;
  #   * the per-passage LABELS the user sees come from NLI -- XLM-R labels nearly
  #     every passage Refutes whatever it says (Phase 5 and 6 demo forwards), and
  #     the template explanation prints those labels.
  # Feeding NLI's distribution to the verdict as well was tried and lost
  # (-0.029, CI [-0.063, +0.006], a03da2746cac), so the aggregator reads XLM-R
  # alone. The verdicts equal the XLM-R arm's, 500/500 (164d2289c90b).
  stance: xlmr_nli
  # Phase 6 (FR-11): logistic regression over the whole top-10 stance
  # distribution, temperature-scaled on dev (T=0.795). +0.0435 macro-F1 over the
  # rule on the claim-only control (CI excludes 0); it fixes the rule's
  # Conflicting over-fire. Artifact path in stage_args below.
  aggregate: learned
  # Phase 6 (FR-15/16/18): IndicBART + LoRA, English, beam. Served ONLY when
  # every sentence passes the NLI gate; otherwise -- and always when abstained
  # -- the template, with the reason in the trace. ~52% of dev explanations on
  # retrieved passages pass.
  generation: indicbart
  faithfulness: nli
  # Phase 7 (FR-19, P2): SemEval-2023 T3 technique flags by keyword rules plus
  # zero-shot NLI on the resident model. UNMEASURED -- no SemEval gold was ever
  # obtained -- so verified by demo only. Runs after every verdict is decided and
  # only copies its list onto the results; it cannot move a verdict.
  manipulation: rules_nli

stage_args:
  preprocess:
    # Post-test: Dakshina lexicon first, rules for the rest. Hand-typed Punjabi
    # CER 0.4281 -> 0.3359 (p7_translit_handtyped_lexicon), the rule fixed first.
    translit: lexicon
  aggregate:
    path: data/interim/models/aggregator_xlmr_nli_prior/model.joblib
  generation:
    decoding: beam
  stance:
    batch_size: 16
  retrieval:
    depth: 200
    fusion: rrf
  free_text_retrieval:
    depth: 100
    fusion: rrf
  matching:
    # No reranker. Both arms were built and measured and both lose to the raw
    # cosine as a GATE: zero-shot NLI destroys the ranking (Success@1 0.4326 ->
    # 0.1062) and the trained cross-encoder learned to score fact-checks rather
    # than pairs (about three quarters of its score variance comes from the
    # candidate alone). Phase 4 entry has the diagnosis.
    reranker: none
    encoder: bge_m3
