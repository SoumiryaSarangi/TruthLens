name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# docs/build-plan.md lists "tests/test_no_leakage.py in CI" as the mitigation
# for silent data leakage. This is that. It installs the core lock only -- no
# torch, no transformers -- so it finishes in well under a minute and there is
# never a reason to skip it.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install pinned dependencies
        run: |
          uv venv --python 3.11
          uv pip sync requirements.txt requirements-dev.txt
          uv pip install -e . --no-deps

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Tests
        run: uv run pytest tests/ -q
        env:
          PYTHONIOENCODING: utf-8

      - name: Leakage and frozen splits
        run: uv run pytest tests/test_no_leakage.py tests/test_splits_frozen.py -q
        env:
          PYTHONIOENCODING: utf-8

      - name: Eval harness end-to-end
        run: uv run python -m eval.evaluate --config configs/example_majority_baseline.yaml
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: src

      # A hand-edited fixture would make the leakage tests assert something
      # other than what scripts/make_fixtures.py says they assert.
      - name: Fixtures match their generator
        run: |
          uv run python scripts/make_fixtures.py
          git diff --exit-code -- tests/fixtures/ \
            || (echo "::error::tests/fixtures/ is out of sync with scripts/make_fixtures.py" && exit 1)
        env:
          PYTHONIOENCODING: utf-8
