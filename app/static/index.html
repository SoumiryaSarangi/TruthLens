<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruthLens</title>
<link rel="stylesheet" href="/static/styles.css">
<!--
  The WhatsApp-styled page of UI_UX.md §3-§9. Markup here, style in
  styles.css, behaviour in app.js, every visible string in i18n/*.json
  (SYSTEM_DESIGN.md §5). No framework, no build step, no web fonts: the demo
  has to work offline (UI_UX.md §2).
-->
</head>
<body>
<div class="phone">
  <header class="topbar">
    <span class="brand"><span aria-hidden="true">◉</span> <span data-i18n="title">TruthLens</span></span>
    <span class="health" id="health" role="status">
      <span class="dot" aria-hidden="true"></span><span id="health-text">…</span>
    </span>
  </header>

  <!-- aria-live so a screen reader announces each reply (UI_UX.md §9). -->
  <main id="chat" class="chat" aria-live="polite">
    <p class="intro" id="intro" data-i18n="intro">Paste a forwarded message. TruthLens checks it and shows you the sources.</p>
  </main>

  <footer class="bottombar">
    <div class="chips" id="chips" role="group" aria-labelledby="chips-label">
      <span id="chips-label" class="sr-only" data-i18n="samples_label">Try an example</span>
    </div>
    <form class="composer" id="composer" novalidate>
      <label for="text" class="sr-only" data-i18n="placeholder">Paste a forwarded message…</label>
      <textarea id="text" rows="2" maxlength="4000" data-i18n-placeholder="placeholder"
                placeholder="Paste a forwarded message…"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send">➤</button>
    </form>
    <p class="composer-error" id="composer-error" role="alert" hidden></p>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
