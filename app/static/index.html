<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruthLens</title>
<link rel="stylesheet" href="/static/styles.css">
<!--
  Phase 1: plain and unstyled on purpose. UI_UX.md puts the WhatsApp-styled
  interface in Phase 7; what this page must do today is prove the API works end
  to end and show the evidence behind a verdict.

  Markup, style and behaviour are split into index.html / styles.css / app.js
  per SYSTEM_DESIGN.md §5, with copy in i18n/ so Phase 7 can translate the
  interface without editing code.
-->
</head>
<body>
<h1>TruthLens <span class="muted" id="health">checking…</span></h1>
<p class="muted">
  Phase 1, English only. Evidence comes from an AVeriTeC claim's own candidate
  pool, so enter a dev claim index to see the full pipeline. Free text has no
  corpus to search yet and will correctly say so rather than guess.
</p>

<label for="idx">AVeriTeC dev claim index (0–499, optional)</label><br>
<input id="idx" type="number" min="0" max="499" style="width:6rem">

<p><label for="text">Claim or forwarded message</label></p>
<textarea id="text" placeholder="Paste a forwarded message…"></textarea>
<button id="go">Check</button>

<!-- aria-live so a screen reader announces the result (UI_UX.md §9). -->
<div id="out" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
