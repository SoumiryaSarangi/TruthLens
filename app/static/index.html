<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruthLens</title>
<link rel="stylesheet" href="/static/styles.css">
<!--
  The WhatsApp-styled page of UI_UX.md §3-§9. Markup here, style in
  styles.css, behaviour in app.js, every visible string in i18n/*.json
  (SYSTEM_DESIGN.md §5). No framework, no build step, no web fonts: the demo
  has to work offline (UI_UX.md §2).
-->
</head>
<body>
<div class="phone">
  <header class="topbar">
    <span class="brand">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/><path d="M8.5 11l1.8 1.8 3.4-3.6"/></svg>
      <span data-i18n="title">TruthLens</span>
    </span>
    <span class="health" id="health" role="status">
      <span class="dot" aria-hidden="true"></span><span id="health-text">…</span>
    </span>
  </header>

  <!-- Desktop only (styles.css, 1100 px and up): the product sentence, set large in the rail. -->
  <section class="hero" aria-labelledby="hero-lead">
    <h1 class="hero-lead" id="hero-lead"></h1>
    <p class="hero-rest" id="hero-rest"></p>
  </section>

  <!-- aria-live so a screen reader announces each reply (UI_UX.md §9). -->
  <main id="chat" class="chat" aria-live="polite">
    <div class="intro" id="intro">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/><path d="M8.5 11l1.8 1.8 3.4-3.6"/></svg>
      <p data-i18n="intro">Paste a forwarded message. TruthLens checks it and shows you the sources.</p>
      <div id="scope-intro"></div>
      <svg class="proof-sheet" viewBox="0 0 560 410" aria-hidden="true" focusable="false"><rect class="ps-back" x="14" y="18" width="520" height="372" rx="14" transform="rotate(-2.2 274 204)"/><rect class="ps-paper" x="14" y="10" width="520" height="372" rx="14"/><path class="ps-margin" d="M84 34 V360"/><path class="ps-crop" d="M14 36 v-22 h22 M526 14 h22 v22 M14 370 v22 h22 M548 370 v22 h-22"/><g class="ps-row" style="--i:0"><path class="ps-mark ps-supported" pathLength="1" d="M34 70 l9 10 l18 -22"/><path class="ps-rule" d="M104 62 h330 M104 76 h294 M104 90 h180"/><path class="ps-pencil ps-supported" pathLength="1" d="M104 82 q 40 -8 80 0 t 80 0"/></g><g class="ps-row" style="--i:1"><path class="ps-mark ps-refuted" pathLength="1" d="M36 113 l22 22 M58 113 l-22 22"/><path class="ps-rule" d="M104 116 h270 M104 130 h234 M104 144 h120"/><path class="ps-pencil ps-refuted" pathLength="1" d="M104 136 q 40 -8 80 0 t 80 0"/></g><g class="ps-row" style="--i:2"><path class="ps-mark ps-conflicting" pathLength="1" d="M32 174 h28 m-8 -8 l8 8 -8 8 M60 186 h-28 m8 -8 l-8 8 8 8"/><path class="ps-rule" d="M104 170 h340 M104 184 h304 M104 198 h190"/><path class="ps-pencil ps-conflicting" pathLength="1" d="M104 190 q 40 -8 80 0 t 80 0"/></g><g class="ps-row" style="--i:3"><path class="ps-mark ps-nei" pathLength="1" d="M36 221 c0 -8 22 -8 22 2 c0 8 -11 8 -11 16 M47 256 h.1"/><path class="ps-rule" d="M104 224 h250 M104 238 h214 M104 252 h100"/><path class="ps-pencil ps-nei" pathLength="1" d="M104 244 q 40 -8 80 0 t 80 0"/></g><g class="ps-row" style="--i:4"><circle class="ps-mark ps-abstained" cx="47" cy="286" r="13" stroke-dasharray="4 5"/><path class="ps-rule" d="M104 278 h306 M104 292 h270 M104 306 h156"/><path class="ps-pencil ps-abstained" pathLength="1" d="M104 298 q 40 -8 80 0 t 80 0"/></g><g class="ps-row" style="--i:5"><path class="ps-mark ps-similar" pathLength="1" d="M32 336 c5 -7 9 -7 14 0 s9 7 14 0 M32 348 c5 -7 9 -7 14 0 s9 7 14 0"/><path class="ps-rule" d="M104 332 h284 M104 346 h248 M104 360 h134"/><path class="ps-pencil ps-similar" pathLength="1" d="M104 352 q 40 -8 80 0 t 80 0"/></g></svg>
    </div>
  </main>

  <footer class="bottombar">
    <!-- The example chips are for demos and first-time users; they stay out of the way. -->
    <details class="examples">
      <summary data-i18n="samples_label">Try an example</summary>
      <div class="chips" id="chips" role="group" aria-label="Examples"></div>
    </details>
    <form class="composer" id="composer" novalidate>
      <label for="text" class="sr-only" data-i18n="placeholder">Paste a forwarded message…</label>
      <textarea id="text" rows="2" maxlength="4000" data-i18n-placeholder="placeholder"
                placeholder="Paste a forwarded message…"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg></button>
    </form>
    <p class="composer-error" id="composer-error" role="alert" hidden></p>
  </footer>
</div>
<!-- Laptop only: the same "what this is for" text from a corner link, over the desk at any time. -->
<button type="button" class="scope-link" popovertarget="scope-pop">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.7M12 17h.01"/></svg>
  <span id="scope-link-text"></span>
</button>
<div class="scope-pop" id="scope-pop" popover><div class="scope-cols" id="scope-pop-body"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
